services:
  ollama:
    image: ollama/ollama:0.40.9
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model-init:
    image: ollama/ollama:0.40.9
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:0.5b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      PORT: "3001"
      VOOOZ_AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    ports:
      - "3001:3001"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
